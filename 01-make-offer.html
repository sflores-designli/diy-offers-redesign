<script src="https://cdn.jsdelivr.net/npm/lucide@1.47.0/dist/umd/lucide.min.js"></script>
<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => Number(String(v ?? '').replace(/[^0-9.]/g,'')) || 0;
const money = n => '$' + Math.round(Number(n)||0).toLocaleString('en-US');
const commas = v => { const n = num(v); return n ? Math.round(n).toLocaleString('en-US') : ''; };
const icon = (n, s) => `<i data-lucide="${n}" class="icon"${s?` style="width:${s}px;height:${s}px"`:''}></i>`;
const refreshIcons = () => { if(window.lucide) window.lucide.createIcons(); };

const HOME = { address:'1428 Lakeshore Dr', city:'Murfreesboro, TN 37130', mls:'2691140', facts:'3 bed · 2 full, 1 half bath · 2,140 sq ft · built 1998 · 0.34 acres', list:459000, suggested:448000, beds:'3', baths:'2.5', sqft:'2,140' };
const SELLER_LEASED = 'Water softener, solar panels';
const SELLER_INCLUDED = 'Refrigerator, washer and dryer, window treatments and blinds, garage door remotes, the backyard shed.';
const SELLER_EXCLUDED = 'The dining room chandelier and the mounted TV in the living room.';
const SELLER_ASSESSMENT = '$4,200 remaining for a neighbourhood road resurfacing, payable over 3 years.';
const NOW = new Date('2026-09-23T14:20:00');

function words(n){
  n = Math.round(n); if(!n) return '';
  const a=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
  const t=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
  const h = x => { let s=''; if(x>=100){ s+=a[Math.floor(x/100)]+' hundred'; x%=100; if(x) s+=' '; } if(x>=20){ s+=t[Math.floor(x/10)]; if(x%10) s+='-'+a[x%10]; } else if(x) s+=a[x]; return s; };
  const parts=[]; const m=Math.floor(n/1e6), k=Math.floor((n%1e6)/1000), r=n%1000;
  if(m) parts.push(h(m)+' million'); if(k) parts.push(h(k)+' thousand'); if(r) parts.push(h(r));
  const s = parts.join(' '); return s.charAt(0).toUpperCase()+s.slice(1)+' dollars';
}
function fmtDate(v, long){ if(!v) return ''; const d=new Date(v+'T12:00:00'); return isNaN(d)?v:d.toLocaleDateString('en-US',{month:long?'long':'short',day:'numeric',year:'numeric'}); }
function fmtDT(d){ return d.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})+' at '+d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})+' CT'; }

const blankBuyer = () => ({ first:'', last:'', email:'', phone:'' });
const DEFAULTS = {
  homeOk:'', buyerType:'', nBuyers:'2', buyers:[blankBuyer(), blankBuyer(), blankBuyer(), blankBuyer()],
  trustName:'', trustDate:'', trustees:'', trustAppear:'', llcName:'', llcState:'', llcSigner:'', llcTitle:'',
  entityType:'', entityOther:'', entName:'', entState:'', entAddr:'', entSigner:'', entTitle:'', entEmail:'', entPhone:'', entAuth:'',
  exchange:'', qiName:'', qiContact:'', qiPhone:'', deed:'', deedTouched:false,
  closingDate:'', possession:'', possessionDate:'',
  method:'', loanType:'', downPayment:'', finContingency:'', preapproval:false,
  offer:'', pof:'', pofUploaded:false, pofDocs:[], pof2Uploaded:false,
  emPick:'', em:'', depositOk:'', depositDays:'',
  soh:'', sohStatus:'', sohDiy:'', sohAddr:'', sohMls:'', sohClose:'', sohAgent:'', sohPhone:'', sohEmail:'', sohFirm:'', sohExpires:'', sohRep:'', frr:false, frrDays:'', frrKick:'',
  insp:'', inspDays:'', appraisal:'',
  title:'', titleOther:'',
  sc:'', scMode:'', scAmt:'', scApply:[], scOther:'',
  agent:'', compMode:'', compAmt:'',
  warranty:'', warrantyAmt:'', warrantyProvider:'', warrantyOther:'', warrantyOrdered:'', warrantyFirm:'',
  sa:'', saInit:'',
  itemsMore:'', excl:'', leased:'', leasedExcept:'',
  requests:[], rqType:'REPAIRS', rqText:'', rqAmt:'', message:'',
  expiry:'', expDate:'', expTime:'',
  paid:false, signed:false
};
let S = JSON.parse(JSON.stringify(DEFAULTS));
let cur = 0, navOpen = false, navExpanded = new Set(), enterAnim = true, lastPct = 0;
const RING_C = 2 * Math.PI * 18;

const isCash = () => S.method === 'CASH';
const people = () => S.buyerType==='MULTIPLE' ? S.buyers.slice(0, Number(S.nBuyers)) : S.buyers.slice(0,1);
const fullName = b => [b.first,b.last].filter(Boolean).join(' ');
const buyerLabel = () => ({ INDIVIDUAL:fullName(S.buyers[0]), MULTIPLE:people().map(fullName).filter(Boolean).join(' & '), TRUST:S.trustName, LLC:S.llcName, ENTITY:S.entName })[S.buyerType] || '';
const autoDeed = () => S.buyerType==='MULTIPLE' ? people().map(fullName).filter(Boolean).join(' and ') : buyerLabel();
const offerN = () => num(S.offer);
function emAmount(){ return S.emPick==='0' ? num(S.em) : S.emPick ? Math.round(offerN()*Number(S.emPick)/100) : 0; }
const depositDays = () => S.depositOk==='NO' && num(S.depositDays) ? num(S.depositDays) : 3;
function recDate(){ const d = new Date(NOW); d.setDate(d.getDate()+1); d.setHours(NOW.getHours()<12?12:17,0,0,0); return d; }
function expiryDate(){
  if(S.expiry==='other'){ if(!S.expDate || !S.expTime) return null; const [h,mm] = S.expTime.match(/\d+/g); const pm = /PM/.test(S.expTime); const d = new Date(S.expDate+'T00:00:00'); d.setHours((Number(h)%12)+(pm?12:0), Number(mm||0)); return d; }
  if(['24','48','72'].includes(S.expiry)){ const d = new Date(NOW.getTime()+Number(S.expiry)*3600e3); if(d.getMinutes()) d.setHours(d.getHours()+1,0,0,0); return d; }
  if(S.expiry==='rec') return recDate();
  return null;
}
const expText = () => { const d = expiryDate(); return d ? fmtDT(d) : ''; };
const inspText = () => ({ RIGHT:'10 days, full rights · seller has 2 days to respond', DAYS:`${num(S.inspDays)} days, full rights · seller has 2 days to respond`, PASSFAIL:'Pass or fail', WAIVE:'Waived' })[S.insp] || '';
const titleText = () => ({ BUYER:'You pay', SELLER:'Seller pays', SPLIT:'Split evenly', OTHER:'Custom arrangement' })[S.title] || '';
function scAmountText(){ const raw=num(S.scAmt); return S.scMode==='%' ? `${money(offerN()*raw/100)} (${raw}% of the purchase price)` : money(raw); }
const SC_APPLY = [['closing','My closing costs','Buyer Expenses',''],['title','Title expenses','Title Expenses',''],['loan','Loan costs and discount points','Loan Costs','Lender charges, discount points, or costs to reduce your interest rate.'],['prepaid','Prepaid expenses and escrows','prepaid expenses and escrows','Property taxes, homeowners insurance, reserves.'],['warranty','A home warranty','a home warranty',''],['other','Something else','other agreed expenses','']];
function scClause(){
  const picked = SC_APPLY.filter(([k])=>S.scApply.includes(k)).map(([k,,l])=>k==='other'&&S.scOther?esc(S.scOther):l);
  const list = picked.length ? picked.slice(0,-1).join(', ')+(picked.length>1?' and/or ':'')+picked.slice(-1) : 'Buyer Expenses';
  return `“Seller to pay ${num(S.scAmt)?scAmountText():'__'} toward ${list} as permitted by applicable requirements.”`;
}
const compText = () => S.compMode==='%' ? `${num(S.compAmt)||'__'}% of the Purchase Price` : money(num(S.compAmt));
const warrantyText = () => ({ BUYER:'You buy it', SELLER:`Seller pays ${money(num(S.warrantyAmt))}`, WAIVED:'No home warranty' })[S.warranty] || '';
const itemsText = () => S.itemsMore.trim();
const sohLate = () => S.soh==='YES' && S.sohClose && S.closingDate && S.sohClose > S.closingDate;
const pofText = () => !isCash() ? (S.preapproval?'Pre-approval received':'') : S.pof==='UPLOAD' ? 'Received' : S.pof==='HOMESALE' ? 'From the sale of your home' : S.pof==='SKIP' ? 'Deferred, due 5 days after binding' : '';

const rows = (key, opts) => `<div class="rich-list">${opts.map(o=>`<button type="button" class="rich-row ${S[key]===o.v?'selected':''}" data-set="${key}" data-val="${o.v}">${o.i?icon(o.i):''}<span class="rich-row-text"><span class="rich-row-title">${o.t}</span>${o.d?`<span class="rich-row-subtitle">${o.d}</span>`:''}</span>${o.aside?`<span class="rich-row-aside">${o.aside}</span>`:''}</button>`).join('')}</div>`;
const checkRows = (key, opts) => `<div class="rich-list">${opts.map(o=>`<button type="button" class="rich-row ${S[key].includes(o.v)?'selected':''}" data-toggle="${key}" data-val="${o.v}"><input type="checkbox" tabindex="-1" ${S[key].includes(o.v)?'checked':''}><span class="rich-row-text"><span class="rich-row-title">${o.t}</span>${o.d?`<span class="rich-row-subtitle">${o.d}</span>`:''}</span></button>`).join('')}</div>`;
const flagRow = (key, t, d) => `<button type="button" class="rich-row ${S[key]?'selected':''}" data-flag="${key}"><input type="checkbox" tabindex="-1" ${S[key]?'checked':''}><span class="rich-row-text"><span class="rich-row-title">${t}</span>${d?`<span class="rich-row-subtitle">${d}</span>`:''}</span></button>`;
const seg = (key, opts, wrap) => `<div class="segmented ${wrap?'wrap':''}">${opts.map(o=>`<button type="button" class="${S[key]===o.v?'active':''}" data-set="${key}" data-val="${o.v}">${o.t}${o.s?`<small>${o.s}</small>`:''}</button>`).join('')}</div>`;
const field = (key, label, o={}) => `<div class="field"><label for="f-${key}">${label}${o.opt?' <span class="field-optional">(Optional)</span>':''}</label><input id="f-${key}" type="${o.type||'text'}" data-bind="${key}" value="${esc(S[key])}" placeholder="${esc(o.ph||'')}"${o.mode?` inputmode="${o.mode}"`:''}${o.style?` style="${o.style}"`:''}>${o.hint?`<p class="field-hint">${o.hint}</p>`:''}</div>`;
const moneyField = (key, label, o={}) => `<div class="field">${label?`<label for="f-${key}">${label}</label>`:''}<div class="field-icon-input ${o.lg?'lg':''}"><span class="affix">${o.pct?'%':'$'}</span><input id="f-${key}" type="text" inputmode="decimal" data-bind="${key}" data-fmt="${o.pct?'':'money'}" value="${esc(S[key])}" placeholder="${esc(o.ph||'0')}"></div>${o.hint?`<p class="field-hint">${o.hint}</p>`:''}</div>`;
const area = (key, label, o={}) => `<div class="field"><label for="f-${key}">${label}${o.opt?' <span class="field-optional">(Optional)</span>':''}</label><textarea id="f-${key}" data-bind="${key}" placeholder="${esc(o.ph||'')}">${esc(S[key])}</textarea></div>`;
const react = (kind, html, ic) => `<div class="field-reaction ${kind}">${icon(ic || ({'good-to-know':'circle-check','value-prompt':'lightbulb','error':'circle-alert','prefill-hint':'info','helper':'info'})[kind])}<div>${html}</div></div>`;
const callout = (title, html, kind, ic) => `<div class="info-callout ${kind||''}"><div class="info-callout-title">${icon(ic||'info')}${title}</div>${html?`<div class="info-callout-text">${html}</div>`:''}</div>`;
const disclosure = (sum, html) => `<details class="disclosure"><summary>${icon('circle-help')}${sum}<span class="chev">${icon('chevron-down')}</span></summary><div class="disclosure-body">${html}</div></details>`;
const qcard = (title, body, sub) => `<div class="question-card"><div class="question-header"><div class="stack-xs"><span class="q-title">${title}</span>${sub?`<span class="q-sub">${sub}</span>`:''}</div></div>${body}</div>`;
const section = (label, body) => `<div class="form-section">${label?`<div class="section-label">${label}</div>`:''}${body}</div>`;
const upload = (flagKey, label, file) => S[flagKey] ? react('good-to-know', `<b>${label} received</b><br>${file} · added to your offer package.`) : `<div class="row-actions"><button type="button" class="btn btn-outline" data-upload="${flagKey}">${icon('upload',16)}Upload ${label.toLowerCase()}</button><span class="field-hint">PDF, JPG or PNG, up to 10 MB.</span></div>`;

const SECTIONS = [
  { name:"Getting started", promise:"The home, who's buying, and when." },
  { name:'Your offer', promise:"How you're paying and your number." },
  { name:'Your protections', promise:'Contingencies that keep you covered.' },
  { name:'Who pays what', promise:'Title, concessions, warranty and assessments.' },
  { name:'Finish up', promise:'What stays, the deadline, then sign.' }
];

const SCREENS = [
  { id:'welcome', sec:0, label:'Get started', type:'cover' },
  { id:'home', sec:0, label:'The home', title:'Is this the right home?', desc:'Have a quick look before we start, everything after this is built around this property.', render:()=>`<div class="prop-row"><span class="prop-thumb"></span><div class="prop-meta"><span class="h4">${HOME.address}</span><span class="p-sm text-muted">${HOME.city} · MLS #${HOME.mls}</span><span class="p-sm text-muted">${HOME.facts}</span><span class="prop-price">${money(HOME.list)}</span></div></div>`+rows('homeOk',[{v:'YES',i:'house',t:'Yes, this is the one'},{v:'NO',i:'search',t:'No, take me back to search'}])+(S.homeOk==='NO'?react('value-prompt','Not the right home? Go back to the listing you meant to offer on. Nothing has been saved to this one.'):''), ok:()=>S.homeOk==='YES' },
  { id:'buyerType', sec:0, label:'Who is buying', title:'Who is buying this home?', desc:"Tell us who will be purchasing and taking ownership of the property. We'll collect what's needed to identify the Buyer(s) in the Purchase and Sale Agreement.", render:()=>rows('buyerType',[{v:'INDIVIDUAL',i:'user',t:'Just me',d:'I will be purchasing the property in my individual name.'},{v:'MULTIPLE',i:'users',t:'Me and other buyers',d:'I will be purchasing the property with one or more additional Buyers.'},{v:'TRUST',i:'landmark',t:'A Trust',d:'The property will be purchased or held through a Trust.'},{v:'LLC',i:'building-2',t:'An LLC',d:'A Limited Liability Company will be purchasing the property.'},{v:'ENTITY',i:'briefcase-business',t:'A partnership, corporation, or other business entity'}]), ok:()=>!!S.buyerType },
  { id:'buyers', sec:0, label:'Buyers', skip:()=>!['INDIVIDUAL','MULTIPLE'].includes(S.buyerType), title:()=>S.buyerType==='MULTIPLE'?'Tell us about each buyer':'Tell us about you', desc:()=>S.buyerType==='MULTIPLE'?'Everyone who will be on the contract. Every buyer reviews and signs the Purchase and Sale Agreement.':'Your legal name is how you will appear on the Purchase and Sale Agreement.', render:()=>(S.buyerType==='MULTIPLE'?callout('Each buyer needs their own email address.','That is an e-signature requirement, not ours, two people cannot sign from the same inbox. Only you need a DIY Residential account; the others do not.','','mail')+`<div class="field" style="max-width:280px"><label for="f-nBuyers">How many buyers</label><select id="f-nBuyers" data-bind="nBuyers" data-rerender="1">${[2,3,4].map(n=>`<option value="${n}" ${S.nBuyers==n?'selected':''}>${n} buyers</option>`).join('')}</select></div>`:'')+section('',people().map((b,i)=>`<div class="buyer-block"><div class="section-label"><span>BUYER ${i+1}</span>${i===0?'<span style="color:var(--primary)">YOU</span>':''}</div><div class="field-grid dense">${['first','last','email','phone'].map(k=>`<div class="field"><label>${({first:'First name',last:'Last name',email:'Email',phone:'Phone'})[k]}${k==='phone'?' <span class="field-optional">(Optional)</span>':''}</label><input type="${k==='email'?'email':k==='phone'?'tel':'text'}" data-buyer="${i}" data-k="${k}" value="${esc(b[k])}"></div>`).join('')}</div></div>`).join(''))+(Number(S.nBuyers)>2&&S.buyerType==='MULTIPLE'?react('prefill-hint','Buyers 3 and up sign an Additional Signature Blocks page (RF 716) that travels with your offer. Nothing extra for you to do.'):''), ok:()=>people().every(b=>b.first&&b.last&&/@/.test(b.email)) && new Set(people().map(b=>b.email.toLowerCase())).size===people().length },
  { id:'trust', sec:0, label:'Trust details', skip:()=>S.buyerType!=='TRUST', title:'Purchasing through a Trust', desc:'Please provide the details of the Trust that will purchase or hold the property, and how the Buyer should appear on the Purchase and Sale Agreement.', render:()=>section('',`<div class="field-grid dense">${field('trustName','Full legal name of the Trust')}${field('trustDate','Date of the Trust',{type:'date'})}${field('trustees','Trustee(s)')}${field('trustAppear','How the Buyer should appear on the PSA')}</div>`)+react('prefill-hint',"We may request documentation confirming the Trustee's authority to purchase and sign documents on behalf of the Trust. The closing or title professional can determine whether a certificate or abstract of trust, or particular portions of the trust documents, are sufficient.")+react('good-to-know','<b>You sign for the Trust.</b> As the account holder, you are the Trust\'s only signer on every document.'), ok:()=>!!S.trustName },
  { id:'llc', sec:0, label:'LLC details', skip:()=>S.buyerType!=='LLC', title:'Purchasing through an LLC', desc:'The LLC will be identified as the Buyer in the Purchase and Sale Agreement. Tell us its legal name, where it was formed, and who signs on its behalf.', render:()=>section('',`<div class="field-grid dense">${field('llcName','Full legal name of LLC')}${field('llcState','State of formation')}${field('llcSigner','Authorized signer')}${field('llcTitle','Title or position of authorized signer')}</div>`)+react('prefill-hint',"Documentation confirming the LLC's existence and the signer's authority to act on its behalf may be required before closing."), ok:()=>!!S.llcName },
  { id:'entity', sec:0, label:'Business entity', skip:()=>S.buyerType!=='ENTITY', title:'Tell us about the business entity purchasing the property', desc:"We'll use this information to properly identify the Buyer and authorized signer in the Purchase and Sale Agreement.", render:()=>section('',`<div class="field"><label>Type of entity</label>${seg('entityType',['Partnership','Limited Partnership (LP)','Limited Liability Partnership (LLP)','Corporation','S Corporation','Other'].map(v=>({v,t:v})),true)}</div>${S.entityType==='Other'?field('entityOther','Other, please describe'):''}<div class="field-grid dense">${field('entName','Full legal name of entity',{hint:'Exactly as on the formation or registration documents.'})}${field('entState','State of formation or organization')}${field('entAddr','Principal business address')}${field('entSigner','Authorized signer, full legal name')}${field('entTitle','Title or capacity',{hint:'President, General Partner, Managing Partner, Authorized Representative.'})}${field('entEmail','Email',{type:'email'})}${field('entPhone','Phone',{type:'tel'})}</div>`)+qcard('Does this person have authority to enter into a real estate Purchase and Sale Agreement on behalf of the entity?',seg('entAuth',[{v:'YES',t:'Yes'},{v:'NO',t:'No, additional authorization is required'}]))+(S.entAuth==='NO'?react('error','<b>We can\'t submit this offer yet.</b> The person signing must have authority to bind the entity. Come back once that authorization is in place.'):react('prefill-hint','<b>Entity documentation.</b> The title or closing company may request documents verifying the entity\'s existence and the signer\'s authority, such as formation documents, resolutions or certificates. We\'ll let you know if more is needed.')), ok:()=>!!S.entName&&!!S.entityType&&S.entAuth==='YES' },
  { id:'x1031', sec:0, label:'1031 exchange', title:'Is this purchase part of a 1031 exchange?', desc:'A 1031 exchange lets you defer taxes by reinvesting the proceeds of another property. Most purchases are not part of one.', render:()=>qcard('Part of a 1031 exchange?',seg('exchange',[{v:'NO',t:'No'},{v:'YES',t:'Yes'}])+(S.exchange==='YES'?`<div class="question-card-reveal"><p class="q-sub">This purchase is being made as part of a 1031 tax-deferred exchange. Your Qualified Intermediary (QI), if one has already been selected; we let the title company and your lender know.</p><div class="field-grid dense">${field('qiName','Qualified Intermediary')}${field('qiContact','Contact')}${field('qiPhone','Phone or email')}</div></div>`:''))+(S.exchange==='YES'?react('value-prompt','Because 1031 exchanges have specific requirements and deadlines, please consult your tax professional and Qualified Intermediary about your eligibility.'):''), ok:()=>!!S.exchange },
  { id:'deed', sec:0, label:'Names on the deed', title:'How should the names appear on the deed?', desc:'This is exactly how the owner names will be written on the deed at closing, so spell them the way they appear on your ID.', render:()=>{ if(!S.deedTouched) S.deed = autoDeed(); return section('',field('deed','Names as they will print on the deed',{hint:`From your buyer details: ${esc(autoDeed()||'not yet')}`})+(S.deedTouched&&autoDeed()?`<button type="button" class="btn-link" data-act="deedReset" style="align-self:flex-start">Use the names from my buyer details</button>`:''))+disclosure('Examples of how names are written',`<ul><li>Dana R. Whitfield and Marcus J. Whitfield, husband and wife</li><li>Dana R. Whitfield and Marcus J. Whitfield, as joint tenants with right of survivorship</li><li>The Whitfield Family Trust, dated March 3, 2019</li></ul><p>Not sure? Your title company can explain how each way of holding title works.</p>`); }, ok:()=>!!S.deed.trim() },
  { id:'closing', sec:0, label:'Closing', title:'When would you like to close?', desc:'And when would you like to move in?', render:()=>section('',`<div style="max-width:280px">${field('closingDate','Closing date',{type:'date'})}</div>`)+`<p class="q-title">Taking possession</p>`+rows('possession',[{v:'CLOSING',i:'key-round',t:'At closing',d:'You get the keys once everyone has signed and the seller has been paid. This is the usual choice.'},{v:'TOA',i:'calendar-range',t:'On a different date we agree with the seller',d:'Either the seller stays on after closing, or you move in before it. This needs a separate written agreement.'}])+(S.possession==='TOA'?callout("We'll prepare a Temporary Occupancy Agreement.","Because your closing and possession dates differ, that agreement has to be attached to your offer and signed by both sides. We'll fill in what we can and walk you through the rest.",'','file-text')+section('',`<div style="max-width:280px">${field('possessionDate','Possession date',{type:'date'})}</div>${S.possessionDate&&S.possessionDate===S.closingDate?react('error','Pick a date different from your closing date, or choose “At closing”.'):''}`):'')+disclosure('How this reads on the contract','<p><b>At closing:</b> “At Closing as evidenced by delivery of warranty deed and payment of Purchase Price.”</p><p><b>Different date:</b> “As agreed in the attached and incorporated Temporary Occupancy Agreement,” listed with the exhibits of your offer.</p>'), ok:()=>!!S.closingDate&&!!S.possession&&(S.possession!=='TOA'||(!!S.possessionDate&&S.possessionDate!==S.closingDate)) },
  { id:'method', sec:1, label:'Cash or financing', title:'How will you be paying for this home?', render:()=>rows('method',[{v:'CASH',i:'banknote',t:'Cash',d:'No mortgage. Fewer moving parts, and sellers tend to prefer it.'},{v:'FINANCING',i:'landmark',t:'Financing',d:'A mortgage from a bank or lender.'}])+(S.method==='CASH'?react('good-to-know','<b>Great, a cash purchase makes your offer simpler.</b> Since there\'s no lender involved, we\'ll guide you through the few things a seller will want to see instead.'):S.method==='FINANCING'?react('value-prompt','<b>We\'ll ask about your financing next.</b> Your lender, your pre-approval, the loan type and the deadlines that come with it.'):''), ok:()=>!!S.method },
  { id:'financing', sec:1, label:'Your loan', skip:()=>S.method!=='FINANCING', title:'Tell us about your loan', desc:'Your loan type, down payment and pre-approval go with your offer, and the seller sees them.', render:()=>section('',`<div class="field"><label>Loan type</label>${seg('loanType',['Conventional','FHA','VA','USDA','Jumbo','Other'].map(v=>({v,t:v})))}</div>${['FHA','VA'].includes(S.loanType)?react('value-prompt','VA or FHA loan? We recommend at least 45 days to close. Check with your lender.'):''}<div style="max-width:320px">${moneyField('downPayment','Down payment',{hint:offerN()&&num(S.downPayment)?`${(100*num(S.downPayment)/offerN()).toFixed(1)}% down · you finance ${money(offerN()-num(S.downPayment))}`:''})}</div>`)+`<p class="q-title">Financing contingency</p>`+rows('finContingency',[{v:'YES',i:'shield-check',t:'Make my offer depend on getting the loan',d:'If the loan falls through within the contract\'s deadlines, you can walk away.'},{v:'NO',i:'shield-off',t:'No financing contingency',d:'Stronger offer, but you are committed even if the loan falls through.'}])+section('Pre-approval letter',upload('preapproval','Pre-approval letter','preapproval-letter.pdf')), ok:()=>!!S.loanType&&S.downPayment!==''&&!!S.finContingency&&S.preapproval },
  { id:'amount', sec:1, label:'Offer amount', title:'How much would you like to offer?', render:()=>{ const v=offerN(), d=v-HOME.list, pct=(d/HOME.list*100); return `<div class="card"><div class="valuation-tiers"><div class="valuation-tier"><span class="badge badge-neutral">List price</span><span class="tier-value">${money(HOME.list)}</span></div><div class="valuation-tier suggested"><span class="badge badge-primary">DIY Residential suggested</span><span class="tier-value">${money(HOME.suggested)}</span></div></div></div>`+section('',`<div style="max-width:360px">${moneyField('offer','Your offer',{lg:true})}</div>${v?`<p class="field-hint">${d===0?'Exactly the list price.':d<0?`${money(-d)} below list (${pct.toFixed(1)}%)`:`${money(d)} above list (+${pct.toFixed(1)}%)`}${v>=HOME.suggested?' · at or above our suggested price.':` · below our suggested price of ${money(HOME.suggested)}.`}</p>${react('prefill-hint',`Written on the contract as: <b>${words(v)}</b>`,'file-pen')}`:''}`)+disclosure('How we got the suggested price','<p>The DIY Residential suggested price comes from recent sales of similar homes nearby and this home\'s own details. It is a guide, not an appraisal, and the seller never sees it next to your offer.</p>'); }, ok:()=>offerN()>0 },
  { id:'pof', sec:1, label:'Proof of funds', skip:()=>!isCash(), title:"Let's verify your funds", desc:"Because you're paying cash, the seller will want confirmation that the money is there. A recent bank or brokerage statement works, or a proof-of-funds letter from your institution.", render:()=>callout('Protect yourself.','Black out account and routing numbers before you upload, they are not needed to show the funds exist. Never type account numbers, routing numbers or any login details into this form.','stop','shield-alert')+rows('pof',[{v:'UPLOAD',i:'upload',t:'Upload proof of funds',d:'Bank statement, brokerage statement, or a letter from your institution.'},{v:'HOMESALE',i:'house',t:'The cash is coming from the sale of my home',d:"We'll ask about that sale in a moment."},{v:'SKIP',i:'clock',t:'Skip for now',d:'Upload it within 5 days after the Binding Agreement Date. We\'ll remind you, and the seller sees your proof of funds as deferred.'}])+(S.pof==='UPLOAD'?section('',upload('pofUploaded','Proof of funds','statement.pdf')):''), ok:()=>!!S.pof&&(S.pof!=='UPLOAD'||S.pofUploaded) },
  { id:'pof2', sec:1, label:'Home sale proceeds', skip:()=>!(isCash()&&S.pof==='HOMESALE'), title:'Show the proceeds of your home sale', desc:"Because you're paying with cash from a home you're selling, the seller may want to verify the funds will be there. Share one or more of these.", render:()=>checkRows('pofDocs',[{v:'psa',t:"Executed Purchase and Sale Agreement for the home you're selling"},{v:'stmt',t:'Preliminary or estimated closing statement showing your expected net proceeds'},{v:'letter',t:'Letter from your title company, closing attorney, or settlement agent confirming the pending sale and anticipated proceeds'},{v:'bank',t:'Bank or investment statement showing any additional funds being used for the purchase'},{v:'none',t:'Sale of Home Contingency; I have no proof of funds at this time',d:'Your contract will say “See Special Stipulations” where the funds are described.'}])+((S.pofDocs.length&&!(S.pofDocs.length===1&&S.pofDocs[0]==='none'))?section('',upload('pof2Uploaded','Documents','home-sale.pdf')):'')+callout('Protect your privacy.','You may redact account numbers and other sensitive information that isn\'t necessary to verify your available funds.','','shield'), ok:()=>S.pofDocs.length>0 },
  { id:'earnest', sec:1, label:'Earnest money', title:'How much earnest money?', desc:'A deposit that shows the seller you mean it. It usually goes toward your purchase price at closing.', render:()=>{ const v=offerN(); return disclosure('How earnest money works, and when you might lose it','<p>Your earnest money may be applied to the purchase price, and it may be refundable or non-refundable depending on the terms of your agreement and what happens during the transaction. Read those terms carefully before you submit.</p><p>There is no single right amount. It is negotiable and depends on the price, the market and the rest of your terms. A common starting range is roughly <b>1% to 3%</b> of the purchase price.</p>')+section('',`<div class="field"><label>Choose an amount</label>${seg('emPick',[{v:'1',t:'1%',s:money(v*.01)},{v:'2',t:'2%',s:money(v*.02)},{v:'3',t:'3%',s:money(v*.03)},{v:'0',t:"I'll enter my own"}])}</div>${S.emPick==='0'?`<div style="max-width:320px">${moneyField('em','Earnest money')}</div>`:S.emPick?`<div class="field" style="max-width:320px"><label>Earnest money</label><div class="field-icon-input"><span class="affix">$</span><input type="text" value="${commas(emAmount())}" disabled></div></div>`:''}`); }, ok:()=>emAmount()>0 },
  { id:'deposit', sec:1, label:'Deposit timing', title:'Can you make your earnest money deposit within 3 days?', desc:()=>`Your deposit of ${money(emAmount())} will be due within 3 days after reaching a Binding Agreement with the seller, as provided in your Purchase and Sale Agreement.`, render:()=>rows('depositOk',[{v:'YES',i:'circle-check',t:'Yes, 3 days works for me'},{v:'NO',i:'calendar-plus',t:'No, I would like to request additional time'}])+(S.depositOk==='NO'?section('',`<div style="max-width:280px">${field('depositDays','Days after the Binding Agreement Date',{mode:'numeric'})}</div>${react('helper',"Any additional time becomes part of your offer and must be accepted by the seller. Once there's a Binding Agreement, we'll send you instructions for the deposit.")}`):''), ok:()=>S.depositOk==='YES'||(S.depositOk==='NO'&&num(S.depositDays)>0) },
  { id:'soh', sec:2, label:'Selling a home', title:'Do you need to sell another home first?', desc:"If this purchase depends on selling a home you already own, we'll add that protection to your offer, and the seller will know where things stand.", render:()=>rows('soh',[{v:'NO',i:'x',t:"No, I don't need to sell another home"},{v:'YES',i:'house',t:'Yes, I need to sell another home first'}]), ok:()=>!!S.soh },
  { id:'soh2', sec:2, label:'Your current home', skip:()=>S.soh!=='YES', title:'Where is that sale up to?', desc:'Each status changes what we add to your offer.', render:()=>{ const st=S.sohStatus; const agent = `<div class="field-grid dense">${field('sohAgent',"Listing agent's full name")}${field('sohFirm',"Listing firm's name")}${field('sohPhone','Agent phone',{type:'tel'})}${field('sohEmail','Agent email',{type:'email'})}${st==='LISTED'?field('sohExpires','Date the listing expires',{type:'date'}):''}</div>${qcard("Do you have a buyer's representation agreement with this agent?",seg('sohRep',[{v:'YES',t:'Yes'},{v:'NO',t:'No'}]))}`; return rows('sohStatus',[{v:'NOT_LISTED',i:'house',t:'Not yet listed',d:'DIY Residential can help you sell it yourself and keep more of the profit, more on that later.'},{v:'LISTED',i:'tag',t:'Listed for sale'},{v:'UNDER_CONTRACT',i:'file-signature',t:'Under contract'},{v:'CLOSING',i:'calendar-check',t:'Closing scheduled'}])+(st?section('Your current home',(st==='LISTED'?qcard('Is it listed with DIY Residential?',seg('sohDiy',[{v:'YES',t:'Yes'},{v:'NO',t:'No'}])):'')+field('sohAddr',"Address of the home you're selling")+`<div class="field-grid dense">${field('sohMls','MLS number')}${['UNDER_CONTRACT','CLOSING'].includes(st)?field('sohClose','Its closing date',{type:'date'}):''}</div>`+(['UNDER_CONTRACT','CLOSING'].includes(st)&&S.sohClose&&S.closingDate?(sohLate()?react('error',`<b>That sale closes after this one.</b> Your own closing is ${fmtDate(S.closingDate,true).replace(/, \d{4}$/,'')}, so the money would not be there in time. Move one of the two dates.`):react('good-to-know','<b>That works.</b> Your sale closes before this purchase, so the funds will be available. We\'ll write the contingency into your offer with this address, MLS number and date.')):'')+((st==='LISTED'&&S.sohDiy==='NO')||['UNDER_CONTRACT','CLOSING'].includes(st)?agent:'')):''); }, ok:()=>!!S.sohStatus&&!!S.sohAddr&&!sohLate() },
  { id:'soh3', sec:2, label:'The contingency', skip:()=>S.soh!=='YES', title:'Your home sale contingency', desc:'This is how it will read in your offer, plus one choice the seller cares about.', render:()=>react('good-to-know',`<b>Added to your offer's Special Stipulations</b><span class="clause">(SALE OF BUYER'S PROPERTY CONTINGENCY) This Agreement is contingent upon the sale and closing of Buyer's property located at ${esc(S.sohAddr||'[address]')}${S.sohStatus==='NOT_LISTED'||!S.sohMls?'':', MLS '+esc(S.sohMls)} ("Buyer's Property") on or before ${fmtDate(S.closingDate,true)||'[closing date]'}. If Buyer's Property does not close on or before ${fmtDate(S.closingDate,true)||'[closing date]'}, Buyer may terminate this Agreement by providing written notice to Seller, in which event Buyer shall be entitled to a refund of Buyer's Earnest Money in accordance with the terms of this Agreement.</span>`,'file-text')+(S.sohStatus==='NOT_LISTED'?react('value-prompt','<b>Your home is not listed yet.</b> Sellers are more likely to accept this contingency if they can keep marketing their home. Consider the option below.'):'')+flagRow('frr','Let the seller keep marketing the home','The seller can keep showing the property and take a better offer, but you get first refusal, a set window to remove your condition and proceed. Some sellers will only accept a home-sale contingency on this basis.')+(S.frr?section('First right of refusal',`<div class="field-grid dense">${field('frrDays','Days to list your home',{mode:'numeric'})}${field('frrKick','Notice to remove your condition (hours)',{mode:'numeric'})}</div>${react('helper','Added to your offer as an addendum (First Right of Refusal, RF 623).')}`):'') },
  { id:'insp', sec:2, label:'Inspections', title:'Inspections', desc:'Buying a home without an inspection is like buying a car without looking under the hood. Pick what suits you.', render:()=>disclosure('Contingencies are protections built into your offer','<p>They identify conditions that must be satisfied before you are required to complete the purchase. Depending on your contract, a contingency may give you the right to investigate, request changes, renegotiate, or terminate if the condition is not met.</p><ul><li><b>Financing:</b> your obligation to close depends on obtaining the required mortgage financing.</li><li><b>Appraisal:</b> protects you if the property does not appraise at the required value; you may renegotiate, bring more cash, or terminate, depending on the contract.</li><li><b>Inspection:</b> a period to inspect the property and request repairs, renegotiate, accept, or terminate.</li><li><b>Sale of home:</b> the purchase depends on you selling an existing property.</li><li><b>Title:</b> requires acceptable, marketable title and gives the seller a chance to cure defects.</li><li><b>Insurance:</b> protects you when satisfactory homeowners insurance cannot be obtained.</li><li><b>HOA or condominium documents:</b> time to review association documents, restrictions, finances and assessments.</li><li><b>Due diligence or document review:</b> surveys, septic, wells, zoning, flood information, leases, permits.</li><li><b>Public water or sewer:</b> the section on access to public water and sewer.</li></ul>')+rows('insp',[{v:'RIGHT',i:'search-check',t:'Full inspection rights',d:'10 days to inspect anything you like, including termites, and to put a repair list together. The seller then has 2 days to respond.',aside:'<span class="badge badge-green">Recommended</span>'},{v:'DAYS',i:'calendar-days',t:"Same, but I'll choose the number of days"},{v:'PASSFAIL',i:'scale',t:'Pass or fail',d:"You still inspect, but you tell the seller up front you won't ask for repairs. Afterwards you either proceed or walk away."},{v:'WAIVE',i:'shield-off',t:'Waive all inspections',d:'You give up every inspection right. Strongest offer, highest risk.'}])+(S.insp==='DAYS'?section('',`<div style="max-width:280px">${field('inspDays','Days to complete all inspections',{mode:'numeric'})}</div>`):'')+(S.insp==='PASSFAIL'?react('prefill-hint','<b>After your inspection you have two choices.</b> <b>Pass:</b> you are satisfied and move forward. <b>Fail:</b> the inspection shows something you are not comfortable with, and you use your right to terminate. It does not mean the home literally passes or fails.'):'')+(S.insp==='WAIVE'?react('error','<b>This one is worth pausing on.</b> Waiving inspections means you accept the home exactly as it is, including anything you have not seen. You will have no inspection-based right to renegotiate or walk away.')+(S.method==='FINANCING'&&['FHA','VA'].includes(S.loanType)?react('error','With an FHA or VA loan, waiving all inspections is not recommended. Talk to your lender first.'):''):S.insp?react('good-to-know',"<b>You don't need an inspector yet.</b> If your offer is accepted, we'll give you a list of inspectors and other vendors. You're always free to use your own, we're just making it easier. For now, let's finish the offer."):''), ok:()=>!!S.insp&&(S.insp!=='DAYS'||num(S.inspDays)>0) },
  { id:'appr', sec:2, label:'Appraisal', title:'Would you like an appraisal?', desc:()=>isCash()?"Paying cash removes the lender, not the value of an appraisal. Nobody is going to require one, but you may still want a professional opinion of what the home is worth before you commit.":'Your lender will order the appraisal. Do you want your offer to depend on the home appraising at the purchase price?', render:()=>(isCash()?disclosure('Why a cash buyer might still want one','<ul><li>Confirms the price is supported by current market data</li><li>Reduces the risk of overpaying without knowing it</li><li>Gives you a real number to make the decision on</li><li>Flags a meaningful gap between the price and the appraised value</li><li>Lets you use any appraisal-related rights in your agreement</li></ul>'):'')+rows('appraisal',[{v:'YES',i:'clipboard-check',t:'Yes, include an appraisal provision'},{v:'NO',i:'x',t:"No, I don't want an appraisal"}]), ok:()=>!!S.appraisal },
  { id:'title', sec:3, label:'Title costs', title:'Who pays the title costs?', desc:"The title search, the owner's title insurance policy, and the lender's policy where there is one. It's negotiable, this is your proposal.", render:()=>rows('title',[{v:'BUYER',i:'user',t:"I'll pay them"},{v:'SELLER',i:'house',t:"I'd like the seller to pay them"},{v:'SPLIT',i:'split',t:'Split them evenly with the seller'},{v:'OTHER',i:'pencil',t:'Something else',d:"Cap the seller's share, or describe your own arrangement."}])+(S.title==='OTHER'?section('',field('titleOther','Describe the arrangement',{hint:'Whatever you write here replaces the standard wording in the contract.'})):'')+(S.title&&S.title!=='OTHER'?react('prefill-hint',`<b>How it reads on the contract</b><span class="clause">${({BUYER:"Buyer to pay cost of title search, mortgagee's policy (if applicable) and owner's title insurance policy.",SELLER:"Seller to pay cost of title search, mortgagee's policy (if applicable) and owner's title insurance policy.",SPLIT:"Buyer and Seller to evenly split the cost of title search, mortgagee's policy (if applicable) and owner's title insurance policy."})[S.title]}</span>`,'file-text'):''), ok:()=>!!S.title&&(S.title!=='OTHER'||!!S.titleOther.trim()) },
  { id:'sc', sec:3, label:'Seller contribution', title:'Would you like the seller to pay any of your costs?', desc:'A seller concession is money the seller agrees to put toward your side of the closing. It reduces what you need on the day.', render:()=>disclosure('What a seller can usually contribute toward','<p>In Tennessee there is no fixed list, the parties negotiate. This is for information only; not all of it will apply to your offer.</p><ol><li>A dollar amount or percentage of the price toward your allowable closing costs</li><li>Title expenses</li><li>Loan-related costs: appraisal, origination, discount points, application, underwriting, document review</li><li>Discount points or an interest-rate buydown</li><li>Prepaid expenses and escrows: taxes, insurance</li><li>Repairs before closing</li><li>A credit instead of repairs</li><li>A purchase-price reduction</li><li>A home warranty</li><li>HOA or association expenses</li><li>Survey expenses</li><li>Closing, attorney or document-preparation expenses</li><li>VA or FHA non-allowable charges</li><li>Buyer-broker compensation, handled separately in the next step</li></ol>')+rows('sc',[{v:'NO',i:'x',t:"No, I'll pay my own costs"},{v:'YES',i:'hand-coins',t:"Yes, I'd like the seller to contribute"}])+(S.sc==='YES'?section('How much',`${seg('scMode',[{v:'$',t:'A dollar amount'},{v:'%',t:'A percentage of the price'}])}${S.scMode?`<div style="max-width:320px">${moneyField('scAmt','Seller contribution',{pct:S.scMode==='%',hint:S.scMode==='%'&&num(S.scAmt)&&offerN()?`${money(offerN()*num(S.scAmt)/100)} at your offer of ${money(offerN())}`:''})}</div>`:''}<p class="q-title">Put it toward</p>${checkRows('scApply',SC_APPLY.map(([v,t,,d])=>({v,t,d})))}${S.scApply.includes('other')?field('scOther','Describe'):''}${react('good-to-know',`<b>This is how it will read in your offer</b><span class="clause">${scClause()}</span>`,'file-text')}${react('helper','Your requested contribution is part of your offer and the seller can accept or negotiate it.')}`):''), ok:()=>S.sc==='NO'||(S.sc==='YES'&&!!S.scMode&&num(S.scAmt)>0&&num(S.scAmt)<(S.scMode==='%'?100:(offerN()||Infinity))) },
  { id:'comp', sec:3, label:"Your agent's pay", title:'Is a real estate agent helping you buy this home?', desc:()=>S.agent==='YES'?"You can ask the seller to pay any agreed buyer-broker compensation that isn't otherwise paid. It is part of your offer and the seller can accept or negotiate it.":'If an agent is helping you, you can ask the seller to pay their compensation at closing.', render:()=>rows('agent',[{v:'NO',i:'user',t:'No, I am buying on my own'},{v:'YES',i:'user-check',t:'Yes, an agent is helping me'}])+(S.agent==='YES'?section("What should the seller pay your agent's brokerage?",`${seg('compMode',[{v:'%',t:'A percentage of the price'},{v:'$',t:'A dollar amount'}])}${S.compMode?`<div style="max-width:320px">${moneyField('compAmt','Compensation',{pct:S.compMode==='%'})}</div>${react('good-to-know',`<b>How it appears in your offer's Special Stipulations</b><span class="clause">BUYER BROKER COMPENSATION: Seller shall pay ${compText()} to Selling Broker (Broker assisting Buyer) at Closing.</span>`,'file-text')}`:''}`):''), ok:()=>S.agent==='NO'||(S.agent==='YES'&&!!S.compMode&&num(S.compAmt)>0) },

    + r('Proof of funds', pofText(), isCash()?'pof':'financing')

    + g('Who pays what')

const visible = () => SCREENS.filter(s => !(s.skip && s.skip()));
const counted = () => visible().filter(s => !s.type);
function ringPct(){ const v = visible(), s = v[cur]; if(s && s.type === 'milestone') return 100; const c = counted(); const i = c.indexOf(s); return i < 0 ? 0 : Math.round(100 * i / c.length); }
function animateRing(){
  const target = ringPct(); const from = lastPct; lastPct = target;
  const fill = document.querySelector('.zone-rail .ring-fill'), numEl = document.querySelector('.zone-rail .ring-num'), ring = document.querySelector('.zone-rail .ring');
  if(!fill || from === target) return;
  requestAnimationFrame(() => { fill.style.strokeDashoffset = RING_C * (1 - target / 100); });
  const t0 = performance.now(), dur = 700;
  const step = now => { const k = Math.min(1, (now - t0) / dur); const e = 1 - Math.pow(1 - k, 3); numEl.textContent = Math.round(from + (target - from) * e) + '%'; if(k < 1) requestAnimationFrame(step); else if(ring){ ring.classList.remove('pop'); void ring.offsetWidth; ring.classList.add('pop'); } };
  requestAnimationFrame(step);
}
function livingRows(){

function refreshRail(){ const r = document.querySelector('.zone-rail'); if(r) r.innerHTML = livingCard(false); }

document.addEventListener('click', e => {
  const t = e.target.closest('[data-set],[data-toggle],[data-flag],[data-act],[data-go],[data-goto],[data-upload],[data-rmreq],[data-sec-toggle]'); if(!t) return;
  if(t.dataset.set){ S[t.dataset.set] = t.dataset.val; if(t.dataset.set==='scMode') S.scAmt=''; if(t.dataset.set==='compMode') S.compAmt=''; render(); return; }
  if(t.dataset.toggle){ const k=t.dataset.toggle, v=t.dataset.val, a=S[k].slice(); const i=a.indexOf(v); i>=0?a.splice(i,1):a.push(v); S[k]=a; render(); return; }
  if(t.dataset.flag){ S[t.dataset.flag] = !S[t.dataset.flag]; render(); return; }
  if(t.dataset.upload){ S[t.dataset.upload] = true; toast('Uploaded'); render(); return; }
  if(t.dataset.rmreq){ S.requests.splice(Number(t.dataset.rmreq),1); render(); return; }
  if(t.dataset.secToggle!==undefined){ const i = Number(t.dataset.secToggle); navExpanded.has(i)?navExpanded.delete(i):navExpanded.add(i); renderNav(); return; }
  if(t.dataset.go!==undefined){ closeNav(); go(Number(t.dataset.go)); return; }
  if(t.dataset.goto){ const i = visible().findIndex(x=>x.id===t.dataset.goto); if(i>=0){ S.returnToReview = true; go(i); } return; }
  const a = t.dataset.act;
  if(a==='next'){ const vis=visible(); if(S.returnToReview && vis[cur].id!=='review'){ S.returnToReview=false; go(vis.findIndex(x=>x.id==='review')); return; } if(cur < vis.length-1) go(cur+1); }
  else if(a==='back'){ if(cur>0) go(cur-1); }
  else if(a==='pay'){ S.paid = true; toast('Payment received'); render(); }
  else if(a==='sign'){ S.signed = true; toast('Signed, your offer is on its way'); render(); }
  else if(a==='deedReset'){ S.deedTouched = false; render(); }
  else if(a==='reset'){ S = JSON.parse(JSON.stringify(DEFAULTS)); lastPct = 0; go(0); }
  else if(a==='addReq'){ if(!S.rqText.trim()){ toast('Describe your request first'); return; } if(S.rqType==='CREDITS'&&!num(S.rqAmt)){ toast('A credit needs its dollar amount'); return; } S.requests.push({ type:S.rqType, text:S.rqText.trim(), amount:S.rqType==='CREDITS'?num(S.rqAmt):null }); S.rqText=''; S.rqAmt=''; render(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.buyer!==undefined){ S.buyers[Number(t.dataset.buyer)][t.dataset.k] = t.value; if(!S.deedTouched) S.deed = autoDeed(); refreshNext(); refreshRail(); return; }
  if(!t.dataset.bind) return;
  S[t.dataset.bind] = t.value;
  if(t.dataset.bind==='deed') S.deedTouched = true;
  if(t.tagName==='SELECT') return;
  if(['offer','scAmt','compAmt','em','downPayment','scOther','saInit'].includes(t.dataset.bind)){
    const pos = t.selectionStart; const id = t.id; render(); const el = document.getElementById(id); if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(_){} }
    return;
  }
  refreshNext(); refreshRail();
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.fmt==='money' && t.dataset.bind){ S[t.dataset.bind] = commas(t.value); later(); return; }
  if(t.dataset.bind && (t.tagName==='SELECT' || t.type==='date')){ S[t.dataset.bind]=t.value; later(); }
});
$('#stepsBtn').addEventListener('click', openNav);
$('#navScrim').addEventListener('click', closeNav);
$('#navClose').addEventListener('click', closeNav);
$('#saveExit').addEventListener('click', () => toast('Saved. You can pick up where you left off from the listing.'));
document.addEventListener('keydown', e => { if(e.key==='Escape') closeNav(); });
render();
</script>
</body>
</html>
